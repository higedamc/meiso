# ═══════════════════════════════════════════════════════════════════
# NOSTR-SPECIFIC
# ═══════════════════════════════════════════════════════════════════

# Nostr NIPs supported by this app
supported_nips:
  - "01"   # Basic protocol
  - "04"   # Encrypted Direct Messages (legacy)
  - "07"   # Window.nostr capability
  - "44"   # Encrypted Payloads (Versioned)
  - "46"   # Nostr Connect (Remote signer protocol)
  - "55"   # Android Signer Application