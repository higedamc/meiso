name: Build APK

on:
  push:
    branches: ['openclaw/**']
    tags: ['v*']
  workflow_dispatch:

# Read-only by default: nothing in this workflow may write to the repository
# or its releases. Releases are published by hand from locally signed APKs.
permissions:
  contents: read

env:
  # Must match the SDK that writes pubspec.lock and builds the release APK
  # (.fvmrc). v1.4.3's shipped libflutter.so carries engine 425cfb54d0 / Dart
  # 3.11.4 = Flutter 3.41.6; CI on 3.38.5 was re-resolving four SDK-pinned
  # packages on every run instead of testing the committed lock (PR #225).
  FLUTTER_VERSION: '3.41.6'
  JAVA_VERSION: '17'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # Pinned to a master commit (the README requires a SHA within master's history);
      # the toolchain that `@stable` used to select is now an explicit input.
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master 2026-10-09
        with:
          toolchain: stable
          targets: aarch64-linux-android

      - name: Cache Rust dependencies
        # Same reasoning as ci.yml: ref-scoped caches, so a poisoned restore needs push
        # access to the ref being built (or to main) already.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5.1.0 # zizmor: ignore[cache-poisoning]
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: rust-android-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: rust-android-

      - name: Install Android NDK
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;27.0.12077973"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> $GITHUB_ENV

      - name: Configure Rust for Android cross-compilation
        run: |
          mkdir -p ~/.cargo
          cat >> ~/.cargo/config.toml << EOF
          [target.aarch64-linux-android]
          linker = "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang"
          EOF

      - run: flutter pub get --enforce-lockfile

      - name: Run code generation
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Run tests
        run: flutter test --no-pub

      - name: Build beta APK
        run: flutter build apk --flavor beta --release --dart-define=BUILD_CHANNEL=beta --target-platform android-arm64

      - name: Upload APK artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: meiso-beta-apk-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-beta-release.apk
          retention-days: 30

  # No release job: GitHub Releases are published by hand from locally built,
  # locally signed APKs. This workflow's beta APK is signed with the runner's
  # throwaway debug keystore, so attaching it to a release served an artifact
  # under a certificate that changed from release to release and could not be
  # installed over the previous beta. It also raced the manual publish: on
  # v1.4.2 it replaced the verified local asset at 10:14:12Z, about eight
  # minutes after that asset had been re-downloaded and checked.
  # The beta APK remains available as the 30-day workflow artifact above.

  notify:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Send Telegram notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BUILD_RESULT: ${{ needs.build.result }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram token/chat id is not fully configured, skipping notification"
            exit 0
          fi
          SHORT_SHA=${SHA::7}
          if [ "$BUILD_RESULT" = "success" ]; then
            TEXT="*meiso Build OK*
          Branch: \`${REF_NAME}\`
          Commit: \`${SHORT_SHA}\`
          [Download APK](${RUN_URL})"
          else
            TEXT="*meiso Build FAILED*
          Branch: \`${REF_NAME}\`
          Commit: \`${SHORT_SHA}\`
          [See logs](${RUN_URL})"
          fi
          curl -fsS -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d parse_mode="Markdown" \
            -d text="$TEXT"
