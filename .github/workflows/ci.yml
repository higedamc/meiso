name: CI

# Fast PR feedback: static analysis + unit tests on host (no Android build).
# Dart runs in `analyze-test`, the Rust crate's unit tests in `rust-test` (host target,
# no NDK). The full APK build + tests live in build-apk.yml (tags / openclaw branches).
on:
  pull_request:
    branches: ['main', 'release/**']
  push:
    branches: ['main', 'release/**']
  workflow_dispatch:
    inputs:
      update_goldens:
        description: >-
          Re-record test/golden/goldens/*.png on this Linux runner and upload them as
          the `goldens` artifact (never record goldens on macOS).
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Nothing in this workflow writes to the repository; artifacts upload with the runtime token.
permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.38.5'

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Check for untranslated l10n messages
        # flutter pub get regenerates lib/l10n/app_localizations*.dart (generate: true
        # in pubspec.yaml) and, per l10n.yaml's untranslated-messages-file, writes a
        # map of locale -> untranslated keys. A translation gap in ja/es is otherwise
        # silent: gen-l10n falls back to the template (en) string with no error and no
        # runtime failure, so it can only be caught by reading this file.
        run: |
          FILE=build/untranslated_messages.json
          if [ ! -f "$FILE" ]; then
            echo "::error::$FILE was not generated; check l10n.yaml's untranslated-messages-file setting"
            exit 1
          fi
          count=$(jq '[.[] | length] | add // 0' "$FILE")
          echo "untranslated message count: $count"
          if [ "$count" -ne 0 ]; then
            echo "::error::$count untranslated l10n message(s) found, see below"
            cat "$FILE"
            exit 1
          fi

      - name: Run code generation
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        # Errors-only: the repo carries a large pre-existing info/warning lint
        # backlog; gate on real breakage (errors) without drowning in style noise.
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run tests
        # Screenshot goldens run in the separate, non-blocking `golden` job below.
        run: flutter test --no-pub --exclude-tags golden

  rust-test:
    # Unit tests of rust/ (NIP-44 wrapping, signature checks, key store, AES helpers) on
    # the host target. No Android NDK or Flutter is needed: `cargo test --lib` builds the
    # crate's test harness for ubuntu-latest and ignores the android linker entries in
    # rust/.cargo/config.toml. Blocking: a failure here fails the PR. Tests that are
    # known-broken are parked with `#[ignore]` and show up as `N ignored` in the summary,
    # never hidden with continue-on-error (see #205, #206).
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Report toolchain
        run: |
          rustup show active-toolchain
          cargo --version

      - name: Cache cargo registry and build output
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            rust/target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-

      - name: Install nak (in-memory Nostr relay for the reconnect tests)
        # rust/src/relay_reconnect.rs spawns `nak serve` on a free port to reproduce a
        # relay outage. Pinned release + sha256 so the test relay cannot change under us.
        # Digest taken from the GitHub release API for v0.20.7 and re-verified by download.
        run: |
          set -euo pipefail
          url=https://github.com/fiatjaf/nak/releases/download/v0.20.7/nak-v0.20.7-linux-amd64
          sha=ba918fafd1b030bc50958a5b218c6386f4c3a57c1e469562d3947e858e0ba56e
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/nak" "$url"
          echo "$sha  $RUNNER_TEMP/nak" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/nak"
          "$RUNNER_TEMP/nak" --version
          echo "MEISO_NAK_BIN=$RUNNER_TEMP/nak" >> "$GITHUB_ENV"

      - name: Run Rust unit tests
        # --locked: Cargo.lock is committed; refuse to resolve a different dependency set
        # than the one the APK is built from.
        # MEISO_RELAY_TESTS_REQUIRED: the nak-backed reconnect tests skip locally when nak
        # is missing; here a skip is a failure, so a missing relay can never pass as green.
        env:
          MEISO_RELAY_TESTS_REQUIRED: '1'
        run: cargo test --lib --locked --manifest-path rust/Cargo.toml

  golden:
    # Screenshot regression via Flutter golden tests (test/golden/). Non-blocking while
    # the trial proves itself: whether it becomes a required check is decided after two
    # unrelated PRs stay green. The PNGs are recorded on this Linux runner only, via
    # `workflow_dispatch` with update_goldens=true; commit the uploaded artifact.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Run code generation
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Report renderer
        run: |
          uname -srm
          flutter --version --machine

      - name: Verify goldens
        if: ${{ inputs.update_goldens != true }}
        run: >-
          flutter test --no-pub --tags golden --run-skipped
          --file-reporter json:golden-report.json

      # A skip-by-default tag can fail "green" by running nothing (for example if
      # --run-skipped stops honouring dart_test.yaml). Require a floor of real runs.
      - name: Require at least 4 golden tests to have run
        if: ${{ always() && inputs.update_goldens != true }}
        run: |
          ran=$(jq -s '[.[] | select(.type == "testDone" and .hidden != true and .skipped != true)] | length' golden-report.json)
          echo "golden tests executed: $ran"
          if [ "$ran" -lt 4 ]; then
            echo "::error::only $ran golden tests ran (expected at least 4); the golden job did not exercise the suite"
            exit 1
          fi

      - name: Upload golden failure diffs
        if: ${{ failure() && inputs.update_goldens != true }}
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures
          path: test/golden/failures/
          if-no-files-found: ignore

      - name: Record goldens
        if: ${{ inputs.update_goldens == true }}
        run: >-
          flutter test --no-pub --tags golden --run-skipped --update-goldens
          --file-reporter json:golden-report.json

      - name: Require at least 4 golden tests to have been recorded
        if: ${{ inputs.update_goldens == true }}
        run: |
          ran=$(jq -s '[.[] | select(.type == "testDone" and .hidden != true and .skipped != true)] | length' golden-report.json)
          echo "golden tests recorded: $ran"
          [ "$ran" -ge 4 ] || { echo "::error::only $ran golden tests recorded"; exit 1; }

      - name: Upload recorded goldens
        if: ${{ inputs.update_goldens == true }}
        uses: actions/upload-artifact@v4
        with:
          name: goldens
          path: test/golden/goldens/*.png
          if-no-files-found: error
